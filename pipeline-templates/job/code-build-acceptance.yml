parameters:
  TargetProjects: 'src/SFA.DAS.Payments.PeriodEnd.AcceptanceTests/SFA.DAS.Payments.PeriodEnd.AcceptanceTests.csproj'

jobs:
- job: AcceptanceBuild
  displayName: Acceptance Build
  pool:
    name: SLD Build pool

  variables:
  - name: SolutionBaseName
    value: SFA.DAS.Payments.PeriodEnd

  steps:
  - template: /azure-pipelines-templates/build/step/gitversion.yml

  - task: UseDotNet@2
    displayName: 'Use .NET 8 SDK'
    inputs:
      packageType: sdk
      version: '8.x'

  - task: NuGetCommand@2
    displayName: 'NuGet restore - Acceptance packages.config'
    inputs:
      command: restore
      restoreSolution: '${{ parameters.TargetProjects }}'
      feedsToUse: 'select'
      vstsFeed: 'dct-pkg'
      noCache: true
      restoreDirectory: 'src/packages'

  - task: MSBuild@1
    displayName: 'Build - Acceptance project'
    inputs:
      solution: '${{ parameters.TargetProjects }}'
      msbuildArchitecture: x64
      configuration: '$(BuildConfiguration)'
      msbuildArguments: >
        /p:Platform="AnyCPU"
        /p:RestorePackages=false
        /p:Version=$(Build.BuildNumber)
        /p:FileVersion=$(Build.BuildNumber)