trigger:
  batch: true
  branches:
    include:
      - "main"
  paths:
    include:
      - Infrastructure/SFA.DAS.Payments.PeriodEnd.Function
      - src/SFA.DAS.Payments.PeriodEnd.Function

variables:
- name: BuildPlatform
  value : 'x64'
- name: BuildConfiguration
  value: 'release'
- name: SolutionBaseName
  value: 'SFA.DAS.Payments.PeriodEnd.Function'
- name: ArtifactName
  value: 'PeriodEndFunction'
- group: Release Management Resources
- group: RELEASE das-payments-v2-periodendfunction

resources:
  repositories:
    - repository: self
    - repository: das-platform-building-blocks
      type: github
      name: SkillsFundingAgency/das-platform-building-blocks
      endpoint: SkillsFundingAgency
      ref: refs/heads/master
    - repository: das-platform-automation
      type: github
      name: SkillsFundingAgency/das-platform-automation
      endpoint: SkillsFundingAgency
      ref: refs/heads/master

stages:
- stage: Build
  jobs:
  #- template: pipeline-templates/job/code-build-acceptance.yml
  - template: pipeline-templates/job/code-build.yml
- template: azure-pipelines-templates/deploy/stage/nuget-publish.yml

- stage: Deploy_DAS
  dependsOn: Build
  displayName: Deploy to DAS
  variables:
  - group: DAS das-payments-v2-periodendfunction
  jobs:
  - template: pipeline-templates/job/deploy.yml
    parameters:
      ServiceConnection: DCT-VSO
      SolutionBaseName: ${{ variables.SolutionBaseName }}
      ArtifactName: $(ArtifactName)
      Environment: DAS

- stage: Deploy_DST
  dependsOn: Build
  displayName: Deploy to DST
